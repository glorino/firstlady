<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="20" fill="#FFF7ED"/>
  <!-- Bottle body -->
  <rect x="60" y="45" width="80" height="115" rx="10" fill="#EA580C"/>
  <rect x="60" y="45" width="80" height="115" rx="10" fill="url(#oil3L)"/>
  <!-- Neck -->
  <rect x="78" y="30" width="44" height="20" rx="6" fill="#C2410C"/>
  <!-- Cap -->
  <rect x="82" y="22" width="36" height="12" rx="4" fill="#DC2626"/>
  <!-- Label -->
  <rect x="68" y="70" width="64" height="50" rx="4" fill="white" fill-opacity="0.9"/>
  <text x="100" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#EA580C">FIRST LADY</text>
  <text x="100" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#9A3412">Red Palm Olein</text>
  <text x="100" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#EA580C">3L</text>
  <!-- Oil level -->
  <rect x="65" y="130" width="70" height="25" rx="4" fill="#FED7AA"/>
  <rect x="65" y="138" width="70" height="17" rx="4" fill="#FB923C"/>
  <defs>
    <linearGradient id="oil3L" x1="60" y1="45" x2="140" y2="160">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
