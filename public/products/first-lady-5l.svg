<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="20" fill="#FFF7ED"/>
  <!-- Gallon body -->
  <rect x="55" y="40" width="90" height="120" rx="8" fill="#EA580C"/>
  <rect x="55" y="40" width="90" height="120" rx="8" fill="url(#oil5L)"/>
  <!-- Handle -->
  <rect x="75" y="28" width="50" height="18" rx="6" fill="#C2410C"/>
  <rect x="85" y="32" width="30" height="10" rx="4" fill="#FFF7ED"/>
  <!-- Cap -->
  <rect x="88" y="22" width="24" height="10" rx="4" fill="#DC2626"/>
  <!-- Label -->
  <rect x="65" y="70" width="70" height="50" rx="4" fill="white" fill-opacity="0.9"/>
  <text x="100" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#EA580C">FIRST LADY</text>
  <text x="100" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#9A3412">Red Palm Olein</text>
  <text x="100" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#EA580C">5L</text>
  <!-- Oil level indicator -->
  <rect x="60" y="130" width="80" height="25" rx="4" fill="#FED7AA"/>
  <rect x="60" y="140" width="80" height="15" rx="4" fill="#FB923C"/>
  <defs>
    <linearGradient id="oil5L" x1="55" y1="40" x2="145" y2="160">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
